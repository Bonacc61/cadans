# Shared Tier Configuration
# €49/mo - Multi-tenant VPS, contributes patterns to Global ReasoningBank

tier: shared
monthly_price_cents: 4900
monthly_price_display: "€49"

# Resource Limits
resources:
  cpu_limit_cores: 1.0
  cpu_reservation_cores: 0.5
  memory_limit_mb: 1024
  memory_reservation_mb: 512
  storage_limit_gb: 5

  # Network bandwidth (future)
  network_bandwidth_mbps: 100

# Features
features:
  channels:
    - whatsapp
    - telegram
    - gmail
    - slack

  skills:
    - email_management
    - calendar_scheduling
    - task_tracking
    - document_summarization

  integrations:
    - google_workspace
    - microsoft_365

  # AI capabilities
  ai:
    model: "claude-3-5-sonnet-20241022"
    max_tokens_per_month: 1000000  # ~€15/mo at $0.015/1k tokens
    rate_limit_per_minute: 20

  # Data monetization
  pattern_contribution:
    enabled: true
    required: true  # Cannot opt out on Shared tier
    domains:
      - recruiting
      - invoicing
      - email_workflows
      - calendar_management

# Limitations
limitations:
  max_groups: 3  # Can use up to 3 messaging groups
  max_contacts: 500
  max_message_history_days: 90
  max_file_upload_mb: 10

# SLA
sla:
  uptime_percent: 99.0
  support_response_hours: 24
  backup_frequency: daily
  backup_retention_days: 7

# Upgrade Path
upgrade:
  next_tier: private
  next_tier_price_cents: 9900
  upsell_triggers:
    - high_api_usage  # Claude API >€30/mo
    - storage_limit_reached
    - wants_data_privacy  # Disable pattern contribution
